[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "battery-docs-rag-agent"
version = "0.1.0"
description = "Grounded, cited RAG over battery/engineering documents, with an agentic test-report mode."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Amirreza Roodsaz" }]

# Install with `pip install -e .` so `import src` works in scripts, tests, and the app.
[tool.setuptools]
packages = ["src", "src.ingest", "src.index", "src.rag", "src.agent", "src.llm"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F = pyflakes+pycodestyle, I = isort, UP = pyupgrade, B = bugbear, SIM = simplify
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # line length handled by black

[tool.ruff.lint.flake8-bugbear]
# Typer's CLI signature pattern uses typer.Argument()/Option() as parameter defaults by
# design — exempt them from B008 (function-call-in-default-argument).
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]  # import `src` package without installing the project
